[project]
name = "netspot"
version = "0.1.0"
description = "NetSpot - Sistema Inteligente de Monitoramento de Rede (NOC Lite)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aio-pika>=9.4.0",
    "apscheduler>=3.11.2",
    "asyncpg>=0.29.0",
    "bcrypt>=5.0.0",
    "dnspython>=2.8.0",
    "fastapi>=0.128.0",
    "httpx>=0.28.1",
    "psutil>=5.9.8",
    "psycopg2-binary>=2.9.9",
    "pysnmp>=7.1.22",
    "python-dotenv>=1.0.1",
    "python-jose[cryptography]>=3.5.0",
    "requests>=2.32.5",
    "sqlalchemy>=2.0.46",
    "uvicorn[standard]>=0.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["Backend/tests"]
python_files = ["test_*.py", "*_test.py"]
pythonpath = ["."]
asyncio_mode = "auto"

