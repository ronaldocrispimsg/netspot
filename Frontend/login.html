<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NetSpot - Login</title>
<link rel="stylesheet" href="css/style.css">
<script>
  (function() {
      const savedTheme = localStorage.getItem("theme");
      if (savedTheme === "dark") {
          document.documentElement.classList.add("dark-theme");
      }
  })();
</script>
</head>

<body class="login-page">

<div class="login-theme-bar">
    <button id="themeToggleBtn" class="theme-switch-pill" type="button" title="Alternar tema claro/escuro" aria-label="Alternar tema claro/escuro">
        <svg class="theme-switch-icon-sun" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <svg class="theme-switch-icon-moon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3a9 9 0 109 9 9.75 9.75 0 00-.67-3.4 6.78 6.78 0 01-7.93-7.93A9.75 9.75 0 0012 3z"/></svg>
        <span class="theme-switch-thumb">
            <svg id="themeToggleIcon" viewBox="0 0 24 24" width="14" height="14"></svg>
        </span>
    </button>
</div>

<main class="login-box" role="main">
    <h1 class="visually-hidden">NetSpot - Autenticação no Sistema</h1>

    <div class="login-logo-container">
        <img src="images/logo/Prancheta 3.png" alt="Logotipo NetSpot" class="login-logo">
    </div>
    <p class="login-subtitle">Painel de monitoramento e alertas</p>

    <form id="loginForm">
        <label for="username" class="visually-hidden">Usuário</label>
        <input id="username" placeholder="Usuário" autocomplete="username" title="Digite seu nome de usuário (padrão inicial: admin)" required>

        <label for="password" class="visually-hidden">Senha</label>
        <div class="password-input-wrap">
            <input id="password" type="password" placeholder="Senha" autocomplete="current-password" title="Digite sua senha de acesso" required>
            <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('password', this)" title="Mostrar senha" aria-label="Mostrar senha">
                <svg class="eye-open" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <svg class="eye-closed hidden" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                    <line x1="2" y1="2" x2="22" y2="22"></line>
                </svg>
            </button>
        </div>

        <button type="submit" class="btn-primary">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><polyline points="10 17 15 12 10 7"></polyline><line x1="15" y1="12" x2="3" y2="12"></line></svg>
            <span>Entrar</span>
        </button>
    </form>
</main>

<div id="toastContainer" class="toast-container" aria-live="polite"></div>

<div id="pwdModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="pwdModalTitle">
  <div class="modal-content">
    <div class="modal-header">
      <h3 id="pwdModalTitle">Troca de Senha Obrigatória</h3>
      <button type="button" class="modal-close-btn" onclick="closeAppModal(document.getElementById('pwdModal'))" title="Fechar" aria-label="Fechar">&times;</button>
    </div>
    <p class="login-subtitle" style="text-align: left; margin-bottom: 12px;">Primeiro acesso detectado. Defina uma nova senha para acessar o sistema.</p>
    
    <label class="modal-label" for="new-pwd">Nova Senha</label>
    <div class="password-input-wrap">
        <input id="new-pwd" type="password" placeholder="Nova senha (mín. 4 caracteres)" autocomplete="new-password" title="A nova senha deve possuir no mínimo 4 caracteres">
        <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('new-pwd', this)" title="Mostrar senha" aria-label="Mostrar senha">
            <svg class="eye-open" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <svg class="eye-closed hidden" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
                <line x1="2" y1="2" x2="22" y2="22"></line>
            </svg>
        </button>
    </div>
    <small class="discovery-helper-text" style="margin-top: -6px; margin-bottom: 8px;">
        Mínimo de 4 caracteres.
    </small>

    <label class="modal-label" for="confirm-pwd">Confirmar Nova Senha</label>
    <div class="password-input-wrap">
        <input id="confirm-pwd" type="password" placeholder="Confirmar nova senha" autocomplete="new-password" title="Repita a nova senha exatamente como digitada acima">
        <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('confirm-pwd', this)" title="Mostrar senha" aria-label="Mostrar senha">
            <svg class="eye-open" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <svg class="eye-closed hidden" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
                <line x1="2" y1="2" x2="22" y2="22"></line>
            </svg>
        </button>
    </div>

    <div class="modal-actions">
      <button type="button" class="modal-btn-primary" onclick="submitChangePassword()">Alterar senha e Entrar</button>
    </div>
  </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
