name: NetSpot CI

on:
  push:
    branches:
      - master
      - dev
      - agent/**
  pull_request:
    branches:
      - master
      - dev

jobs:
  test:
    name: Backend Test Suite (Pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends snmp iputils-ping

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Test Suite
        env:
          PYTHONPATH: .
          NETSPOT_SECRET_KEY: test_secret_key_ci_environment_only_12345
          NETSPOT_DEFAULT_ADMIN_PASSWORD: test_admin_password_ci_only
          DATABASE_URL: "sqlite:///:memory:"
          RABBITMQ_HOST: localhost
        run: |
          pytest Backend/tests -v --durations=10

      - name: Run Standalone Incident Smoke Test
        env:
          PYTHONPATH: .
        run: |
          python Backend/tests/alert_logic_checklist.py
